<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100" role="img" aria-label="Rotating terminal lines: Mechatronics engineer (B.Eng.); leadership-oriented, agile and Scrum; focus on AI, computer vision, sensors, automation; studying M.Eng. AI for Smart Sensors and Actuators" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.t{font-family:'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;font-size:17px}
.slot{opacity:0;animation:slot 16s infinite}
.m,.r,.c,.s,.bar{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:steps(1,end);animation-delay:inherit}
.pr{fill:#6b7280}.k{fill:#a78bfa}.eq{fill:#9ca3af}.v{fill:#e5e7eb}
