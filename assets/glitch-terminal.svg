@keyframes red{0%{opacity:.9;transform:translate(-6px,0)}0.6%{transform:translate(5px,1px)}1.2%{transform:translate(-4px,0)}1.8%{opacity:0}12%{opacity:.85;transform:translate(-5px,0)}12.4%{opacity:0}22.6%{opacity:.9;transform:translate(6px,0)}23.2%{transform:translate(-6px,1px)}23.8%{transform:translate(4px,0)}24.4%{opacity:.9}100%{opacity:0}}
@keyframes cyan{0%{opacity:.9;transform:translate(6px,0)}0.6%{transform:translate(-5px,-1px)}1.2%{transform:translate(4px,0)}1.8%{opacity:0}12%{opacity:.8;transform:translate(5px,0)}12.4%{opacity:0}22.6%{opacity:.9;transform:translate(-6px,0)}23.2%{transform:translate(6px,-1px)}23.8%{transform:translate(-4px,0)}24.4%{opacity:.9}100%{opacity:0}}
@keyframes scr{0%{opacity:1}0.9%{opacity:0}1.2%{opacity:.8}1.5%{opacity:0}12%{opacity:.7}12.3%{opacity:0}23%{opacity:.8}23.6%{opacity:0}23.9%{opacity:.8}24.4%{opacity:0}100%{opacity:0}}
@keyframes barr{0%{opacity:.3}1%{opacity:0}12%{opacity:.25}12.3%{opacity:0}23%{opacity:.3}24%{opacity:0}100%{opacity:0}}
@keyframes barc{0%{opacity:0}0.5%{opacity:.25}1.5%{opacity:0}12.2%{opacity:.2}12.5%{opacity:0}23.4%{opacity:.25}24.2%{opacity:0}100%{opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.slot{animation:none;opacity:0}.slot:first-of-type{opacity:1}.r,.c,.s,.bar,.m{animation:none;opacity:0}.m{opacity:1}}
</style>
