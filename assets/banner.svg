@keyframes fr{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes rg{0%{opacity:0}12%{opacity:.9;transform:translate(-3px,0)}13.2%{opacity:0}100%{opacity:0}}
@keyframes cg{0%{opacity:0}12%{opacity:.9;transform:translate(3px,0)}13.2%{opacity:0}100%{opacity:0}}
