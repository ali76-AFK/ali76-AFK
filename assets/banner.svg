@keyframes sb{0%{opacity:0}50%{opacity:.35}51.2%{opacity:0}100%{opacity:0}}
@keyframes bk{0%{opacity:1}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.fr{animation:none;opacity:1}.rr,.cc,.nm,.nr,.nc,.sl{animation:none;opacity:0}.dot{animation:none}}
</style>
